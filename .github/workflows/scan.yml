name: iNat Comment Moderation Scan on: schedule: # Every 6 hours. Adjust to taste -- more frequent runs mean smaller, # faster batches; less frequent runs mean each run has more to do. - cron: "0 */6 * * *" workflow_dispatch: {} # lets you trigger a run manually from the Actions tab permissions: contents: write concurrency: group: inat-mod-scan cancel-in-progress: false jobs: scan: runs-on: ubuntu-latest # Kill switch layer #1 (see README): if the repo variable SCANNER_ENABLED # is explicitly set to "false", skip the job entirely -- no checkout, no # dependency install, no API calls of any kind. Any other value (unset, # "true", etc) runs normally. if: vars.SCANNER_ENABLED != 'false' steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.11" - name: Cache pip packages uses: actions/cache@v4 with: path: ~/.cache/pip key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }} - name: Cache local toxicity model uses: actions/cache@v4 with: path: ~/.cache/huggingface # Bump this key (or change TOXICITY_MODEL) if you ever switch models. key: hf-model-martin-ha-toxic-comment-model - name: Install dependencies run: pip install -r requirements.txt - name: Run scanner env: PYTHONUNBUFFERED: "1" INAT_PLACE_ID: ${{ vars.INAT_PLACE_ID }} INAT_PROJECT_ID: ${{ vars.INAT_PROJECT_ID }} LOOKBACK_MONTHS: ${{ vars.LOOKBACK_MONTHS }} TOXIC_THRESHOLD: ${{ vars.TOXIC_THRESHOLD }} run: python scanner/scan.py - name: Commit updated backlog run: | git config user.name "inat-mod-scanner-bot" git config user.email "actions@users.noreply.github.com" git add docs/data/ git diff --cached --quiet || git commit -m "Update moderation backlog [skip ci]" git push
